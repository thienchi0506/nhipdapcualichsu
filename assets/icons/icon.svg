<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A1208"/>
      <stop offset="60%" stop-color="#240702"/>
      <stop offset="100%" stop-color="#0E0301"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="30%" stop-color="#F1C40F"/>
      <stop offset="70%" stop-color="#D4AC0D"/>
      <stop offset="100%" stop-color="#B7950B"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer Bronze Drum Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#D4AC0D" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#D4AC0D" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Concentric Sun Center -->
  <circle cx="256" cy="256" r="48" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <circle cx="256" cy="256" r="28" fill="#4A1208"/>
  <circle cx="256" cy="256" r="14" fill="url(#goldGrad)"/>

  <!-- 14 Sun Rays of Dong Son Bronze Drum -->
  <g fill="url(#goldGrad)">
    <polygon points="303.0,246.0 371.0,256.0 303.0,266.0"/>
    <polygon points="302.6,267.4 359.6,305.9 294.0,285.4"/>
    <polygon points="293.1,286.5 327.7,345.9 277.5,298.9"/>
    <polygon points="276.2,299.6 281.6,368.1 256.7,304.0"/>
    <polygon points="255.3,304.0 230.4,368.1 235.8,299.6"/>
    <polygon points="234.5,298.9 184.3,345.9 218.9,286.5"/>
    <polygon points="218.0,285.4 152.4,305.9 209.4,267.4"/>
    <polygon points="209.0,266.0 141.0,256.0 209.0,246.0"/>
    <polygon points="209.4,244.6 152.4,206.1 218.0,226.6"/>
    <polygon points="218.9,225.5 184.3,166.1 234.5,213.1"/>
    <polygon points="235.8,212.4 230.4,143.9 255.3,208.0"/>
    <polygon points="256.7,208.0 281.6,143.9 276.2,212.4"/>
    <polygon points="277.5,213.1 327.7,166.1 293.1,225.5"/>
    <polygon points="294.0,226.6 359.6,206.1 302.6,244.6"/>
  </g>

  <!-- Flying Lac Bird Accents (Concentric Ring) -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round">
    <!-- Bird 1 (Top Left) -->
    <path d="M 130 180 Q 150 160 180 165 Q 160 180 145 195 Z" fill="url(#goldGrad)"/>
    <!-- Bird 2 (Bottom Right) -->
    <path d="M 382 332 Q 362 352 332 347 Q 352 332 367 317 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Title Monogram / Text Banner at bottom -->
  <g font-family="'Times New Roman', serif" font-weight="bold" text-anchor="middle">
    <text x="256" y="440" fill="#FFEAA7" font-size="32" letter-spacing="4">DẤU CHÂN LỊCH SỬ</text>
    <text x="256" y="470" fill="#D4AC0D" font-size="20" letter-spacing="6">HÀO KHÍ NGÀN NĂM</text>
  </g>
</svg>
