<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm tra Bạch Đằng</title><body><h1>Kiểm tra sông, nhân vật, chiến đấu và quân đội</h1><p>Fixture core có trạng thái thiết lập riêng; không phải chơi thử tự nhiên hoặc benchmark FPS.</p><pre id="result">Đang chạy…</pre><script type="module">import {runRiverTests} from './river-tests.js';import {runCharacterTests} from './character-tests.js';import {runArmyTests} from './army-tests.js';const river=await runRiverTests(),characters=await runCharacterTests(),army=await runArmyTests();const r={river,characters,army,passed:river.passed+characters.passed+army.passed,total:river.total+characters.total+army.total};document.getElementById('result').textContent=JSON.stringify(r,null,2);document.title=`${r.passed}/${r.total} — Kiểm tra Bạch Đằng`;</script></body></html>
